<h1>✅ 静态网页通过隧道访问成功</h1>
<p>这是 nginx 提供的一个纯静态页面，被 Caddy 从 <code>/site</code> 剥离前缀后转发到 <code>127.0.0.1:8088</code>。</p>
<p>如果你能看到这段文字，说明：<b>公网 → cloudflared → Caddy → nginx</b> 整条链路和静态资源都没问题。</p>
